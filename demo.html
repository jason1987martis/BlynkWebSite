<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Blynk Web Dashboard — Legacy 0.41.x (Connector)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #035cede1 0%, #0a0a2e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
        }

        .header {
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 242, 255, 0.2);
        }

        .header h1 {
            margin: 0;
            color: #00f2ff;
            text-shadow: 0 0 15px #00f2ff;
            font-size: 20px;
        }

        .connector-box {
            position: relative;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 242, 255, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 90%;
            max-width: 400px;
            margin: 20px auto;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        .connector-box h2 {
            margin-bottom: 25px;
            color: #00f2ff;
            text-shadow: 0 0 15px #00f2ff;
            font-size: 24px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .input-box {
            margin: 15px 0;
            position: relative;
        }

        .input-box label {
            display: block;
            margin-bottom: 5px;
            color: #00f2ff;
            font-size: 14px;
            font-weight: 500;
            text-align: left;
        }

        .input-box input {
            width: 95%;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(0, 242, 255, 0.3);
            outline: none;
            font-size: 14px;
            background: rgba(26, 26, 26, 0.8);
            color: #ffffff;
            box-shadow: inset 0 2px 4px rgba(0, 242, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-box input:focus {
            border-color: #00f2ff;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.5), inset 0 2px 4px rgba(0, 242, 255, 0.1);
        }

        .input-box input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .btn {
            margin-top: 20px;
            padding: 12px 24px;
            width: 100%;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #00f2ff 0%, #00c4d6 100%);
            color: #000000;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: linear-gradient(135deg, #00c4d6 0%, #0099aa 100%);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 242, 255, 0.4);
        }

        .btn:disabled {
            background: rgba(0, 242, 255, 0.3);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .status-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            display: none;
            text-align: left;
            line-height: 1.5;
        }

        .status-success {
            background: rgba(17, 176, 204, 0.2);
            color: #00f2ff;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.3);
        }

        .status-fail {
            background: rgba(255, 85, 85, 0.2);
            color: #ff5555;
            box-shadow: 0 0 12px rgba(255, 85, 85, 0.3);
            border: 1px solid rgba(255, 85, 85, 0.3);
        }

        .status-connecting {
            background: rgba(0, 200, 255, 0.2);
            color: #00f2ff;
            box-shadow: 0 0 12px rgba(0, 242, 255, 0.3);
            border: 1px solid rgba(0, 242, 255, 0.3);
        }

        .modes-info {
            margin-top: 10px;
            padding: 10px;
            background: rgba(255, 255, 0, 0.1);
            border-radius: 6px;
            border-left: 4px solid #ffff00;
            font-size: 13px;
            color: #ffff88;
            text-align: left;
        }

        .projects-section {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.6);
        }

        .section {
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }

        .section h3 {
            color: #00f2ff;
            margin: 0 0 10px 0;
            font-size: 18px;
        }

        .kv {
            color: #cccccc;
            font-size: 12px;
            margin: 5px 0;
        }

        .pill {
            background: rgba(0, 242, 255, 0.2);
            color: #00f2ff;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            border: 1px solid rgba(0, 242, 255, 0.3);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 10px;
        }

        .card {
            background: rgba(26, 26, 26, 0.8);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(0, 242, 255, 0.2);
            box-shadow: 0 2px 8px rgba(0, 242, 255, 0.1);
        }

        .card h3 {
            margin: 0 0 5px 0;
            font-size: 14px;
            color: #ffffff;
        }

        button {
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
            width: 100%;
        }

        button[data-state="1"] {
            background: #00ff00;
            color: #000;
        }

        button[data-state="0"] {
            background: #ff0000;
            color: #fff;
        }

        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }

        @media (max-width: 480px) {
            .connector-box {
                padding: 20px;
                margin: 10px;
            }

            .connector-box h2 {
                font-size: 20px;
            }

            .grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-plug-circle"></i> Blynk Web Dashboard Connector (Legacy 0.41.x)</h1>
    </div>

    <div class="connector-box">
        <h2><i class="fas fa-server"></i> Server Connector</h2>

        <div class="input-box">
            <label for="server"><i class="fas fa-server"></i> Server Address</label>
            <input type="text" id="server" placeholder="e.g., blynk-cloud.com" required>
        </div>

        <div class="input-box">
            <label for="token"><i class="fas fa-key"></i> Auth Token</label>
            <input type="password" id="token" placeholder="Enter your authentication token" required>
        </div>

        <button class="btn" id="connectBtn">
            <i class="fas fa-link"></i> CONNECT
        </button>

        <div id="status" class="status-box"></div>
        <div id="modes" class="modes-info" style="display: none;"></div>
    </div>

    <div id="projectsWrap" class="projects-section"></div>

    <script>
        const els = {
            server: document.getElementById('server'),
            token: document.getElementById('token'),
            connectBtn: document.getElementById('connectBtn'),
            status: document.getElementById('status'),
            modes: document.getElementById('modes'),
            projectsWrap: document.getElementById('projectsWrap'),
        };
        let baseURL = "";
        let pollTimer = null;
        const REFRESH_MS = 2000;

        let WRITE_MODE = null; // 'hw_post_form'|'hw_get'|'hw_post_text'|'external_get'|'external_post'|'update'|'virtual'|'pin'
        let READ_MODE = null; // 'get'|'external_get'|'hw_vr_post_form'|'hw_vr_get'|'hw_vr_post_text'

        try {
            const saved = JSON.parse(localStorage.getItem('blynk_web_cfg_rugged') || "{}");
            if (saved.server) els.server.value = saved.server;
            if (saved.token) els.token.value = saved.token;
            if (saved.wm) WRITE_MODE = saved.wm;
            if (saved.rm) READ_MODE = saved.rm;
            showModes();
        } catch {}

        function setStatus(t) { els.status.textContent = t; }
        function showModes() {
            els.modes.textContent = `API Modes: write=${WRITE_MODE || '?'}, read=${READ_MODE || '?'}`;
            els.modes.style.display = baseURL ? 'block' : 'none';
        }
        function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
        function saveCfg() {
            localStorage.setItem('blynk_web_cfg_rugged', JSON.stringify({
                server: els.server.value.trim(),
                token: els.token.value.trim(),
                wm: WRITE_MODE, rm: READ_MODE
            }));
        }
        function bases() {
            const h = els.server.value.trim();
            if (!h) return [];
            return [`http://${h}:8080`, `https://${h}:9443`, `http://${h}:9443`];
        }
        async function tryFetch(url, opts = {}) {
            const res = await fetch(url, { cache: 'no-store', ...opts });
            if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
            return res;
        }
        async function tryJSON(url, opts = {}) {
            const res = await tryFetch(url, opts);
            const ct = res.headers.get('content-type') || '';
            if (ct.includes('application/json')) return res.json();
            const txt = await res.text(); try { return JSON.parse(txt); } catch { return txt; }
        }
        function escapeHTML(s) { return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }

        function normPrefix(t) { const x = (t || '').toString().toUpperCase(); if (x === 'V' || x === 'VIRTUAL') return 'V'; if (x === 'D' || x === 'DIGITAL') return 'D'; if (x === 'A' || x === 'ANALOG') return 'A'; return ''; }
        function extractPinString(w) {
            if (!w) return '';
            if (typeof w.pin === 'string' && /^[VDA]\d+$/i.test(w.pin)) return w.pin.toUpperCase();
            const arr = Array.isArray(w.pins) && w.pins.length ? w.pins[0] : null;
            const pNum = (w.pin ?? (arr ? arr.pin : undefined));
            const pType = (w.pinType ?? w.pin_type ?? (arr ? arr.pinType : undefined));
            const pref = normPrefix(pType);
            if (pref && pNum !== undefined) return `${pref}${pNum}`;
            if (w.dataStreamId !== undefined) return `V${w.dataStreamId}`;
            const maybe = (w.attachedPin || w.datastream || '').toString().toUpperCase();
            if (/^[VDA]\d+$/.test(maybe)) return maybe;
            return '';
        }
        function pinToHW(pin) {
            const m = pin.match(/^([VDA])(\d+)$/i); if (!m) return null;
            const t = m[1].toUpperCase(), n = m[2];
            return { cmd: t === 'V' ? 'vw' : (t === 'D' ? 'dw' : 'aw'), num: n };
        }

        async function resolveBaseAndFetchProjects() {
            const token = els.token.value.trim(); if (!token) throw new Error('Auth token required.');
            const eps = [(b) => `${b}/${token}/projects`, (b) => `${b}/${token}/project`, (b) => `${b}/${token
